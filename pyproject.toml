[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passageway"
version = "0.1.0"
description = "Retrieval for Claude over MCP: connectors feed passages, an eval harness keeps them honest"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.28.1",
    "mcp-login-oauth",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pyyaml>=6.0",
    "sentencepiece>=0.2.2",
    "sqlite-vec>=0.1.6",
    "starlette>=0.40",
    "tokenizers>=0.20",
    "uvicorn>=0.30",
]

[project.scripts]
passageway = "passageway.server:main"

[tool.hatch.build.targets.sdist]
exclude = ["corpus"]  # CC BY-SA text, not part of the AGPL package

[tool.hatch.build.targets.wheel]
packages = ["passageway"]

[tool.uv.sources]
mcp-login-oauth = { git = "https://github.com/Marceltov/mcp-login-oauth", rev = "v0.1.1" }
passageway-connector-wikipedia = { workspace = true }
passageway-connector-markdown = { workspace = true }
passageway-connector-trilium = { workspace = true }
passageway-embedder-openai = { workspace = true }
passageway-sdk = { workspace = true }

[dependency-groups]
dev = ["jsonschema>=4.23", "pytest>=8.3", "pytest-asyncio>=0.24", "passageway-connector-wikipedia", "passageway-connector-markdown", "passageway-connector-trilium", "passageway-embedder-openai", "passageway-sdk"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "connectors", "sdk", "corpus", "embedders"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.workspace]
members = ["connectors/*", "sdk", "embedders/*"]
