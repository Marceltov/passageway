[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "passageway"
version = "0.3.0"
description = "Retrieval for Claude over MCP: connectors feed passages, an eval harness keeps them honest"
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.28.1",
    "mcp-login-oauth>=0.2.3",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pyyaml>=6.0",
    "sentencepiece>=0.2.2",
    "sqlite-vec>=0.1.6",
    "starlette>=0.40",
    "tokenizers>=0.20",
    "truststore>=0.10",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
confluence = ["passageway-connector-confluence==0.3.0"]
github = ["passageway-connector-github==0.3.0"]
llmstxt = ["passageway-connector-llmstxt==0.3.0"]
mkdocs = ["passageway-connector-mkdocs==0.3.0"]
markdown = ["passageway-connector-markdown==0.3.0"]
sitemap = ["passageway-connector-sitemap==0.3.0"]
trilium = ["passageway-connector-trilium==0.3.0"]
wikipedia = ["passageway-connector-wikipedia==0.3.0"]
openai = ["passageway-embedder-openai==0.3.0"]
all = ["passageway-connector-confluence==0.3.0", "passageway-connector-github==0.3.0", "passageway-connector-llmstxt==0.3.0", "passageway-connector-markdown==0.3.0", "passageway-connector-mkdocs==0.3.0", "passageway-connector-sitemap==0.3.0", "passageway-connector-trilium==0.3.0", "passageway-connector-wikipedia==0.3.0", "passageway-embedder-openai==0.3.0"]

[project.scripts]
passageway = "passageway.server:main"

[tool.hatch.build.targets.sdist]
exclude = ["corpus"]  # CC BY-SA text, not part of the AGPL package

[tool.hatch.build.targets.wheel]
packages = ["passageway"]

[tool.uv.sources]
passageway-connector-wikipedia = { workspace = true }
passageway-connector-markdown = { workspace = true }
passageway-connector-llmstxt = { workspace = true }
passageway-connector-mkdocs = { workspace = true }
passageway-connector-sitemap = { workspace = true }
passageway-connector-trilium = { workspace = true }
passageway-connector-confluence = { workspace = true }
passageway-connector-github = { workspace = true }
passageway-embedder-openai = { workspace = true }
passageway-sdk = { workspace = true }

[dependency-groups]
dev = ["jsonschema>=4.23", "pytest>=8.3", "pytest-asyncio>=0.24", "passageway-connector-wikipedia", "passageway-connector-markdown", "passageway-connector-llmstxt", "passageway-connector-mkdocs", "passageway-connector-sitemap", "passageway-connector-trilium", "passageway-connector-confluence", "passageway-connector-github", "passageway-embedder-openai", "passageway-sdk"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "connectors", "sdk", "corpus", "embedders"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.workspace]
members = ["connectors/*", "sdk", "embedders/*"]
