# The roadmap, as data. docs_hooks/roadmap.py renders it as the timeline on the Roadmap page.
#
# Open entries (status next, later or decide) are shown first, in the order of this file, each with a `when` label and `details`.
# Done entries are shown below them, newest date first (the order of this file breaks ties), each with a `date` and a link to its
# pull request or release.
#
# To finish a step: set `status: done`, replace `when` with `date: YYYY-MM-DD`, add the link to its pull request, and move it to the
# top of the done entries. `icon` is the name of a Material Design icon (https://pictogrammers.com/library/mdi/).
# `details` is a small subset of markdown: paragraphs, "- " lists, **bold**, `code` and [links](https://...).

items:
  # ---- open ------------------------------------------------------------------------------------------------------------
  - id: embedders
    status: next
    when: Next
    icon: cube-outline
    title: Embedders, the rest
    summary: Ready-made adapters and presets, so that choosing a model is a line of configuration.
    links:
      - {label: "#41", url: "https://github.com/Marceltov/passageway/issues/41"}
      - {label: "V1", url: "https://passageway.marceltov.de/values/#v1-the-core-knows-no-source-and-no-model-beyond-its-default"}
      - {label: "V2", url: "https://passageway.marceltov.de/values/#v2-nothing-leaves-your-machine-unless-you-send-it"}
      - {label: "V3", url: "https://passageway.marceltov.de/values/#v3-numbers-are-measured-never-tuned"}
    details: |
      - **Done:** a bundled adapter for OpenAI-compatible services, which covers Ollama, LM Studio, vLLM, OpenAI and Voyage ([docs](https://passageway.marceltov.de/embedders/openai/)). It speaks the embedder protocol, so it needed no change in the core. Cloud models send all indexed text and queries to a third party; the default stays local and the docs say so.
      - **Done:** the built-in `onnx` embedder generalised with presets (`multilingual-e5-small`, the default; `multilingual-e5-base`; `jina-v2-base-de`), a `device` setting (`auto` is CPU: CoreML was measured four times slower on these models and gives different vectors; `coreml` is opt-in) and an automatic, checksummed model download in place of the manual step in the install guide.
      - Relevance thresholds are recalibrated with `passageway eval compare` on the public corpus, not carried over from earlier measurements. The [first measurements](https://passageway.marceltov.de/measurements/) are the baseline: hit@3 89% and silence 80% at the default threshold, with reworded questions (61%) and near-topic questions (60% silent) as the weak spots.

  - id: confluence-connector
    status: later
    when: Later
    icon: puzzle-outline
    title: Confluence connector
    summary: Index Confluence spaces. Written from the public REST documentation.
    links:
      - {label: "#43", url: "https://github.com/Marceltov/passageway/issues/43"}
      - {label: "V1", url: "https://passageway.marceltov.de/values/#v1-the-core-knows-no-source-and-no-model-beyond-its-default"}
      - {label: "V7", url: "https://passageway.marceltov.de/values/#v7-secrets-are-references"}
    details: |
      A decision is needed first: **Cloud, Data Center or both**, because authentication and API paths differ.

  - id: hook-plugin-image
    status: later
    when: Later
    icon: docker
    title: Hook, plugin, sidecar image, quickstart
    summary: What is still to move over from trilium-recall.
    links:
      - {label: "#44", url: "https://github.com/Marceltov/passageway/issues/44"}
      - {label: "V4", url: "https://passageway.marceltov.de/values/#v4-passages-not-answers"}
      - {label: "V8", url: "https://passageway.marceltov.de/values/#v8-self-hosted-and-open"}
    details: |
      The `/recall` endpoint with its skip rules and per-session memory exists. Still to move over:
      - the `UserPromptSubmit` hook script and its self-test, and the setup skill;
      - the sidecar Docker image: a multi-stage build, the model baked in and verified by checksum, a health check, memory settings;
      - a minimal local quickstart: a generated password in the config directory and a documented launchd example.

  - id: trilium-recall-adopts
    status: later
    when: Later
    icon: swap-horizontal
    title: trilium-recall adopts passageway
    summary: After parity, trilium-recall points here.
    links:
      - {label: "#45", url: "https://github.com/Marceltov/passageway/issues/45"}
      - {label: "V5", url: "https://passageway.marceltov.de/values/#v5-the-index-is-disposable-the-sources-stay-the-truth"}
      - {label: "V11", url: "https://passageway.marceltov.de/values/#v11-one-honest-page-beats-three-vague-ones"}
    details: |
      trilium-recall becomes a thin distribution (a `passageway.toml` with the Trilium connector, its plugin, docs that point here) or is archived with a pointer.
      It is a breaking change for its users, so it needs a migration guide:
      - `RECALL_*` becomes `PASSAGEWAY_*`;
      - the tool's `instance` argument becomes `source`;
      - configuration moves to `passageway.toml`.

