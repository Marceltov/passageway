site_name: passageway
site_description: "Retrieval for Claude over MCP: connectors feed passages, and a relevance gate keeps it quiet when nothing fits."
site_url: https://passageway.marceltov.de/
repo_url: https://github.com/Marceltov/passageway
repo_name: Marceltov/passageway
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Marcel Bruckner. The code is licensed under <a href="https://github.com/Marceltov/passageway/blob/main/LICENSE">AGPL-3.0-or-later</a>; the sample corpus is <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>

hooks:
  - docs_hooks/roadmap.py

exclude_docs: |
  superpowers/

nav:
  - Home: index.md
  - What passageway stands for: values.md
  - Start:
      - Install and run: install.md
      - Configuration: configuration.md
      - Run it: deploy.md
  - Concepts:
      - How it works: how-it-works.md
  - Guides:
      - Claude Code, the hook and the plugin: guides/claude-code.md
      - Write a connector: guides/write-a-connector.md
      - Measure retrieval quality: guides/evaluate.md
      - Work with an AI agent: guides/agents.md
  - Reference:
      - Connector protocol: reference/connector-protocol.md
      - Embedder protocol: reference/embedder-protocol.md
      - Connector SDK: reference/sdk.md
      - Sample corpus: reference/corpus.md
      - Measurements: measurements.md
      - Choosing a model: models.md
  - Connectors:
      - Wikipedia: connectors/wikipedia.md
      - Markdown: connectors/markdown.md
      - Trilium: connectors/trilium.md
      - Confluence: connectors/confluence.md
  - Embedders:
      - OpenAI-compatible: embedders/openai.md
  - Contributing:
      - Development: development.md
      - Roadmap: roadmap.md
  - Decisions:
      - adr/0001-out-of-process-connectors.md
      - adr/0002-connectors-as-workspace-packages.md
      - adr/0003-json-lines-over-a-subprocess-stays.md
      - adr/0004-no-summary-for-source-substitution.md
      - adr/0005-confluence-data-center-first.md
      - adr/0006-https-trusts-the-system-store.md
      - adr/0006-https-trusts-the-system-store.md

theme:
  name: material
  custom_dir: overrides
  logo: logo.svg
  favicon: logo.svg
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Start: [index.md, values.md, install.md, configuration.md, deploy.md]
        Concepts: [how-it-works.md]
        Guides: ["guides/*.md"]
        Reference: ["reference/*.md", measurements.md, models.md]
        Connectors: ["connectors/*.md"]
        Embedders: ["embedders/*.md"]
        Contributing: [development.md, roadmap.md]
        Decisions: ["adr/*.md"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
