name: Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Which jobs a change needs. A job skipped here counts as passed for the ruleset; a change to this file runs everything.
  # The test suite reads the docs, the skills and the workflows (tests/test_docs.py, tests/test_agent_files.py), so it runs
  # for nearly everything: only files no test and no build reads leave it out.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      test: ${{ steps.filter.outputs.test }}
      docs: ${{ steps.filter.outputs.docs }}
      image: ${{ steps.filter.outputs.image }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            test:
              - '**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.github/workflows/pages.yml'
              - '!.github/workflows/audit.yml'
              - '!.github/workflows/dependabot-automerge.yml'
            docs:
              - '.github/workflows/checks.yml'
              - 'docs/**'
              - 'docs_hooks/**'
              - 'mkdocs.yml'
              - 'README.md'
              - 'connectors/*/README.md'
              - 'embedders/*/README.md'
              - 'sdk/README.md'
              - 'skills/**'
              - 'scripts/publish-skills.sh'
              - 'corpus/**'
            image:
              - '.github/workflows/checks.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'README.md'
              - 'passageway/**'
              - 'sdk/**'
              - 'connectors/**'
              - 'embedders/**'
            plugin:
              - '.github/workflows/checks.yml'
              - '.claude-plugin/**'
              - 'skills/**'
              - 'hooks/**'
              - 'scripts/recall-hook.sh'
              - 'scripts/test-recall-hook.sh'
  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen --all-packages
      - run: uv run pytest -q
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # mkdocs<2: Material 9 isn't compatible with MkDocs 2.0. --strict fails on broken links.
      - run: uvx --with mkdocs-material==9.7.7 --with mkdocs-llmstxt==0.5.1 --with 'mkdocs<2' mkdocs build --strict
      - name: The agent files are in the site
        run: |
          scripts/publish-skills.sh site
          test -s site/llms.txt && test -s site/llms-full.txt
          test -s site/SKILL.md && test -s site/skills/create-passageway-connector/SKILL.md
          grep -q "Write a connector" site/llms-full.txt && grep -q "CATEGORY_DEPTH" site/llms-full.txt   # the Wikipedia include made it in
          grep -q "pw-timeline" site/roadmap/index.html && grep -q "Markdown connector" site/llms-full.txt   # the roadmap timeline
          grep -q "pw-header-links" site/index.html && grep -q "passageway.marceltov.de/llms-full.txt" site/index.html   # the header links
  # The plugin manifest, the skills and the hook, checked the way Claude Code loads them.
  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: bash scripts/test-recall-hook.sh
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the sidecar image
        run: docker build -t passageway:ci .
      - name: Start it with one fake source and ask it something
        run: |
          mkdir -p ci-config
          echo '[{"id": "a", "title": "Lighthouses", "url": "http://x/a", "version": "1", "sections": [{"heading": null, "text": "Lighthouses guide ships safely into the harbour at night."}]}]' > ci-config/items.json
          printf '[[connector]]\nname = "fake"\ncommand = ["python", "-m", "passageway.testing.fake_connector"]\nenv = { FAKE_ITEMS = "/config/items.json" }\n' > ci-config/passageway.toml
          docker run -d --name pw -e PASSAGEWAY_LOGIN_PASSWORD=ci-only -p 8082:8082 -v "$PWD/ci-config:/config:ro" passageway:ci
          for i in $(seq 1 60); do curl -s http://localhost:8082/health | grep -q '"status":"ok"' && break; sleep 2; done
          curl -s http://localhost:8082/health | grep -q '"status":"ok"' || { docker logs pw; exit 1; }
          curl -sf -H "Authorization: Bearer ci-only" -H "Content-Type: application/json" \
            -d '{"prompt": "which lighthouses guide ships into the harbour at night"}' http://localhost:8082/recall | grep -q Lighthouses \
            || { docker logs pw; exit 1; }
          docker rm -f pw
