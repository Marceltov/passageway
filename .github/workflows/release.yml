name: Release

# A v* tag creates a GitHub release, posts its notes to notefeed (once per tag), publishes every package to PyPI and builds the image.
#
#   git tag -a v0.2.0 -m "A one-line headline for the release"
#   git push origin v0.2.0
#
# The tag must equal the version in pyproject.toml (scripts/check-version.sh) and the tests must pass.
# The notes are the annotated tag's message, the pull requests merged since the previous release and
# install instructions (scripts/release-notes.sh). Without the NOTEFEED_FEED secret (forks) nothing is posted.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to publish again, for example v0.2.0"
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Tag matches the project version
        run: scripts/check-version.sh "$TAG"

      - uses: astral-sh/setup-uv@v10.3.3
      - name: Tests
        run: |
          uv sync --frozen --all-packages
          uv run pytest -q

      - name: Assemble the release notes
        run: scripts/release-notes.sh "$TAG" > notes.md

      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi

      # Posts the notes of the release as published, plus a link to it. A re-run does not post twice. A failure here is
      # shown but does not hold back the image.
      - name: Post the notes to notefeed
        continue-on-error: true
        env:
          NOTEFEED_FEED: ${{ secrets.NOTEFEED_FEED }}
          NOTEFEED_FEED_PASSWORD: ${{ secrets.NOTEFEED_FEED_PASSWORD }}
        run: |
          gh release view "$TAG" --json body,url --jq '.body + "\n\n[The release on GitHub](" + .url + ")\n"' > notefeed.md
          scripts/post-to-notefeed.sh "$TAG" notefeed.md

  publish:
    # Every package to PyPI at the tag's version by trusted publishing (no stored token): the SDK first because the others depend on
    # it, the core last because its extras pin the others. --check-url skips what is already on PyPI, so a re-run after a half-failed
    # release carries on instead of failing. A published version can never be replaced, only yanked.
    runs-on: ubuntu-latest
    needs: release
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build every package
        run: uv build --all-packages
      - name: Check the metadata
        run: uvx twine check dist/*
      - name: Publish
        # Each project has a trusted publisher for this repository, this workflow and the pypi environment. A new package
        # needs a pending publisher on pypi.org before its first release; without one the upload fails instead of asking for a token.
        run: |
          packages="passageway-sdk passageway-connector-confluence passageway-connector-llmstxt passageway-connector-markdown passageway-connector-mkdocs passageway-connector-sitemap passageway-connector-trilium passageway-connector-wikipedia passageway-embedder-openai passageway"
          # An old tag run again by hand builds an old tree whose versions differ: refuse before the first upload, because
          # a half-published release (the SDK up, the rest missing) cannot be repaired.
          for package in $packages; do
            [ "$(compgen -G "dist/${package//-/_}-${TAG#v}*" | wc -l)" -eq 2 ] || { echo "dist/ has no wheel and sdist of $package at ${TAG#v}" >&2; exit 1; }
          done
          for package in $packages; do
            uv publish --trusted-publishing always --check-url https://pypi.org/simple/ "dist/${package//-/_}-${TAG#v}"*
          done

  image:
    # The sidecar image for amd64 and arm64, tagged with the version; latest moves only on a pushed version tag.
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image=$(echo "ghcr.io/${{ github.repository_owner }}/passageway" | tr '[:upper:]' '[:lower:]')
          tags="-t $image:${TAG#v}"
          if [ "${{ github.event_name }}" = "push" ]; then tags="$tags -t $image:latest"; fi
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg APP_VERSION="${TAG#v}" $tags --push .
      - name: Build and push the variant with a browser
        # For the sitemap connector's RENDER: the same image plus Chromium, tagged <version>-browser and, on a pushed tag, browser.
        run: |
          image=$(echo "ghcr.io/${{ github.repository_owner }}/passageway" | tr '[:upper:]' '[:lower:]')
          tags="-t $image:${TAG#v}-browser"
          if [ "${{ github.event_name }}" = "push" ]; then tags="$tags -t $image:browser"; fi
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg APP_VERSION="${TAG#v}" --build-arg WITH_BROWSER=1 $tags --push .
