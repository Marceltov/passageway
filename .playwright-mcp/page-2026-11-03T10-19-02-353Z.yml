          - link "¶" [ref=e70] [cursor=pointer]:
            - /url: http://127.0.0.1:8000/#how-it-fits-together
        - paragraph [ref=e72]:
          - text: "passageway is the retrieval half of a RAG system, served as an MCP tool. It does no generation: the agent that calls it reads the passages and writes the answer."
          - link "How it works" [ref=e73] [cursor=pointer]:
            - /url: http://127.0.0.1:8000/how-it-works/
        - list [ref=e75]:
          - listitem [ref=e76]:
            - strong [ref=e77]: The core knows no source.
            - text: A connector is any executable that prints items as JSON Lines.
          - listitem [ref=e78]:
            - strong [ref=e79]: Quiet on purpose.
            - text: A relevance gate returns nothing instead of padding a prompt with weak matches.
          - listitem [ref=e80]:
            - strong [ref=e81]: Measured.
            - text: Right article in the top three for 88.6% (95% interval 79–94%) of 70 questions on a sample corpus.
            - link "The method and its limits" [ref=e82] [cursor=pointer]:
              - /url: http://127.0.0.1:8000/measurements/
          - listitem [ref=e83]:
            - strong [ref=e84]: Small.
            - text: One SQLite file per source, on the CPU, with no vector database to run.
        - heading [level=2] [ref=e85]:
          - text: Start
