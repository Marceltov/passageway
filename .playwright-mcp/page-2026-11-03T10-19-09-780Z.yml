            - /url: http://127.0.0.1:8000/how-it-works/
        - list [ref=f2e75]:
          - listitem [ref=f2e76]:
            - strong [ref=f2e77]: The core knows no source.
            - text: A connector is any executable that prints items as JSON Lines.
          - listitem [ref=f2e78]:
            - strong [ref=f2e79]: Quiet on purpose.
            - text: A relevance gate returns nothing instead of padding a prompt with weak matches.
          - listitem [ref=f2e80]:
            - strong [ref=f2e81]: Measured.
            - text: Right article in the top three for 88.6% (95% interval 79–94%) of 70 questions on a sample corpus.
