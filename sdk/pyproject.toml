[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passageway-sdk"
version = "0.2.9"
description = "Write a passageway connector as three small functions: the protocol plumbing is done for you"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
web = ["httpx>=0.28.1", "truststore>=0.10"]

[tool.hatch.build.targets.wheel]
packages = ["passageway_sdk"]

[dependency-groups]
dev = ["pytest>=8.3", "passageway", "httpx>=0.28.1", "truststore>=0.10"]

[tool.uv.sources]
passageway = { workspace = true }
