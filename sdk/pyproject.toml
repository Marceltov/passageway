[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "passageway-sdk"
version = "0.5.0"
description = "Write a passageway connector as three small functions: the protocol plumbing is done for you"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
web = ["httpx>=0.28.1", "truststore>=0.10"]
html = ["selectolax>=0.3.21"]

[tool.hatch.build.targets.wheel]
packages = ["passageway_sdk"]

[dependency-groups]
dev = ["pytest>=8.3", "passageway", "httpx>=0.28.1", "truststore>=0.10", "selectolax>=0.3.21"]

[tool.uv.sources]
passageway = { workspace = true }
