[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passageway-embedder-openai"
version = "0.1.0"
description = "passageway embedder for OpenAI-compatible embedding services: Ollama, LM Studio, vLLM, OpenAI, Voyage"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["httpx>=0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["passageway_embedder_openai"]

[dependency-groups]
dev = ["pytest>=8.3", "passageway"]

[tool.uv.sources]
passageway = { workspace = true }
