# Questions for the sample corpus (corpus/en and corpus/de): 100 questions, 70 with accepted answers and 30 that nothing in
# the corpus answers. Run them with corpus/measure.sh. They never name a language or a source: one `recall` searches every
# source, so a question in one language may be answered by an article in the other, and an accepted answer lists the
# articles of both languages that explain it (`expect_id` is the file name; the comment names the articles).
#
# Groups: definition (what is X), how-why (how or why does X work), paraphrase (hardly any words in common with the
# article), cross-language (the only good article is in the other language), near-topic (a technique the corpus does not
# cover) and off-topic (nothing to do with machine learning). The unanswerable ones have no `expect_id`: any hit is noise.
#
# The questions were written, and every accepted answer checked against the text of the articles, before the first
# measurement; a question that turns out wrong is fixed in its own, visible commit, never to improve the numbers.


