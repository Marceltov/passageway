[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passageway-connector-confluence"
version = "0.3.0"
description = "passageway connector for Confluence Data Center: the pages of chosen spaces, read-only"
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = ["passageway-sdk[web]~=0.3.0", "selectolax>=0.3.21"]

[tool.hatch.build.targets.wheel]
packages = ["passageway_connector_confluence"]

[dependency-groups]
dev = ["jsonschema>=4.23", "pytest>=8.3", "passageway"]

[tool.uv.sources]
passageway = { workspace = true }
passageway-sdk = { workspace = true }
