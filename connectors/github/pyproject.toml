[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "passageway-connector-github"
version = "0.5.0"
description = "passageway connector for GitHub repositories: their documentation and, if asked, their code"
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = ["passageway-sdk[web]~=0.5.0"]

[tool.hatch.build.targets.wheel]
packages = ["passageway_connector_github"]

[dependency-groups]
dev = ["jsonschema>=4.23", "pytest>=8.3", "passageway"]

[tool.uv.sources]
passageway = { workspace = true }
passageway-sdk = { workspace = true }
