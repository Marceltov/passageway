[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "passageway-connector-sitemap"
version = "0.4.0"
description = "passageway connector for a website: its sitemap and the pages it links to"
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = ["passageway-sdk[web,html]~=0.4.0", "selectolax>=0.3.21"]

[project.optional-dependencies]
render = ["playwright>=1.49"]

[tool.hatch.build.targets.wheel]
packages = ["passageway_connector_sitemap"]

[dependency-groups]
dev = ["jsonschema>=4.23", "pytest>=8.3", "passageway"]

[tool.uv.sources]
passageway = { workspace = true }
passageway-sdk = { workspace = true }
