[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passageway-connector-trilium"
version = "0.1.0"
description = "passageway connector for Trilium Notes: the notes of a Trilium server through its ETAPI, read-only"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["httpx>=0.28.1", "passageway-sdk", "selectolax>=0.3.21", "truststore>=0.10"]

[tool.hatch.build.targets.wheel]
packages = ["passageway_connector_trilium"]

[dependency-groups]
dev = ["jsonschema>=4.23", "pytest>=8.3", "passageway"]

[tool.uv.sources]
passageway = { workspace = true }
passageway-sdk = { workspace = true }
