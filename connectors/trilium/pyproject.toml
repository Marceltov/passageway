[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "passageway-connector-trilium"
version = "0.5.0"
description = "passageway connector for Trilium Notes: the notes of a Trilium server through its ETAPI, read-only"
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = ["passageway-sdk[web]~=0.5.0", "selectolax>=0.3.21"]

[tool.hatch.build.targets.wheel]
packages = ["passageway_connector_trilium"]

[dependency-groups]
dev = ["jsonschema>=4.23", "pytest>=8.3", "passageway"]

[tool.uv.sources]
passageway = { workspace = true }
passageway-sdk = { workspace = true }
