[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passageway-connector-markdown"
version = "0.3.0"
description = "passageway connector for a folder of markdown files with front matter"
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = ["passageway-sdk~=0.3.0", "pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["passageway_connector_markdown"]

[dependency-groups]
dev = ["jsonschema>=4.23", "pytest>=8.3", "passageway"]

[tool.uv.sources]
passageway = { workspace = true }
passageway-sdk = { workspace = true }
